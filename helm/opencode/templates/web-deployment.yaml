apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opencode.fullname" . }}-web
  labels:
    {{- include "opencode.labels" . | nindent 4 }}
    {{- with .Values.globalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.web.deployment.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with or .Values.globalAnnotations .Values.web.deployment.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "opencode.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "opencode.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
        {{- with .Values.globalLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.web.pod.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with .Values.globalAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.web.pod.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "opencode.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}-web
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["opencode"]
          args:
            - "web"
            - "--port"
            - {{ .Values.web.port | quote }}
            - "--hostname"
            - {{ .Values.web.hostname | default "0.0.0.0" | quote }}
          {{- with .Values.web.extraArgs }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
              protocol: TCP
          workingDir: /home/opencode/workspace
          env:
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.web.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.web.probes.liveness.enabled }}
          livenessProbe:
            {{- if .Values.web.probes.liveness.httpGet }}
            httpGet:
              path: {{ .Values.web.probes.liveness.httpGet.path }}
              port: http
            {{- else if .Values.web.probes.liveness.tcpSocket }}
            tcpSocket:
              port: {{ .Values.web.probes.liveness.tcpSocket.port }}
            {{- end }}
            initialDelaySeconds: {{ .Values.web.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.web.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.web.probes.liveness.timeoutSeconds }}
            successThreshold: {{ .Values.web.probes.liveness.successThreshold }}
            failureThreshold: {{ .Values.web.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.web.probes.readiness.enabled }}
          readinessProbe:
            {{- if .Values.web.probes.readiness.httpGet }}
            httpGet:
              path: {{ .Values.web.probes.readiness.httpGet.path }}
              port: http
            {{- else if .Values.web.probes.readiness.tcpSocket }}
            tcpSocket:
              port: {{ .Values.web.probes.readiness.tcpSocket.port }}
            {{- end }}
            initialDelaySeconds: {{ .Values.web.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.web.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.web.probes.readiness.timeoutSeconds }}
            successThreshold: {{ .Values.web.probes.readiness.successThreshold }}
            failureThreshold: {{ .Values.web.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.web.probes.startup.enabled }}
          startupProbe:
            {{- if .Values.web.probes.startup.httpGet }}
            httpGet:
              path: {{ .Values.web.probes.startup.httpGet.path }}
              port: http
            {{- else if .Values.web.probes.startup.tcpSocket }}
            tcpSocket:
              port: {{ .Values.web.probes.startup.tcpSocket.port }}
            {{- end }}
            initialDelaySeconds: {{ .Values.web.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.web.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.web.probes.startup.timeoutSeconds }}
            successThreshold: {{ .Values.web.probes.startup.successThreshold }}
            failureThreshold: {{ .Values.web.probes.startup.failureThreshold }}
          {{- end }}
          volumeMounts:
            {{- if .Values.persistence.config.enabled }}
            - name: config
              mountPath: /home/opencode/.config/opencode
            {{- end }}
            {{- if .Values.persistence.data.enabled }}
            - name: data
              mountPath: /home/opencode/.local/share/opencode
            {{- end }}
            {{- if .Values.persistence.workspace.enabled }}
            - name: workspace
              mountPath: /home/opencode/workspace
            {{- end }}
            {{- if .Values.persistence.playbook.enabled }}
            - name: playbook
              mountPath: {{ .Values.persistence.playbook.mountPath | default "/home/opencode/workspace/playbook" }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.web.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      volumes:
        {{- if .Values.persistence.config.enabled }}
        - name: config
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.config.existingClaim | default (print (include "opencode.fullname" .) "-config") }}
        {{- end }}
        {{- if .Values.persistence.data.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.data.existingClaim | default (print (include "opencode.fullname" .) "-data") }}
        {{- end }}
        {{- if .Values.persistence.workspace.enabled }}
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.workspace.existingClaim | default (print (include "opencode.fullname" .) "-workspace") }}
        {{- end }}
        {{- if .Values.persistence.playbook.enabled }}
        - name: playbook
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.playbook.existingClaim | default (print (include "opencode.fullname" .) "-playbook") }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}